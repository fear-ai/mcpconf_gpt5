version: "1.0"
servers:
  - id: weather
    name: Weather (Quickstart Python)
    deployment: local
    transport: stdio
    type: python
    command: uv
    args: ["--directory", "/ABSOLUTE/PATH/TO/PARENT/FOLDER/weather", "run", "weather.py"]
    source:
      repository: "https://modelcontextprotocol.io/quickstart/server"
      license: "?"
      available: true
      vendor: "MCP"

  - id: everything
    name: Server Everything (Node)
    deployment: local
    transport: stdio
    type: node
    command: npx
    args: ["-y", "@modelcontextprotocol/server-everything"]
    source:
      repository: "https://github.com/modelcontextprotocol/servers"
      license: "Apache-2.0"
      available: true
      vendor: "Model Context Protocol"

  - id: cloudflare-observability
    name: Cloudflare Observability
    deployment: remote
    transport: sse
    type: http
    url: "https://observability.mcp.cloudflare.com/sse"
    source:
      repository: "https://github.com/cloudflare/mcp-server-cloudflare"
      license: "Apache-2.0"
      available: true
      vendor: "Cloudflare"

  - id: cloudflare-bindings
    name: Cloudflare Bindings
    deployment: remote
    transport: sse
    type: http
    url: "https://bindings.mcp.cloudflare.com/sse"
    source:
      repository: "https://github.com/cloudflare/mcp-server-cloudflare"
      license: "Apache-2.0"
      available: true
      vendor: "Cloudflare"

  - id: cli-mcp-server
    name: CLI MCP Server (Python)
    deployment: local
    transport: stdio
    type: python
    command: uvx
    args: ["cli-mcp-server"]
    env:
      ALLOWED_DIR: "/your/desired/dir"
      ALLOWED_COMMANDS: "ls,cat,pwd,echo"
      ALLOWED_FLAGS: "-l,-a,--help,--version"
      MAX_COMMAND_LENGTH: "1024"
      COMMAND_TIMEOUT: "30"
      ALLOW_SHELL_OPERATORS: "false"
    source:
      repository: "https://github.com/MladenSU/cli-mcp-server"
      license: "MIT"
      available: true
      vendor: "Community"

  - id: sentry
    name: Sentry
    deployment: remote
    transport: http
    type: http
    url: "https://mcp.sentry.dev/mcp"
    source:
      repository: "https://mcp.sentry.dev"
      license: "?"
      available: false
      vendor: "Sentry"

  - id: github
    name: GitHub MCP (Copilot)
    deployment: remote
    transport: http
    type: http
    url: "https://api.githubcopilot.com/mcp/"
    auth:
      scheme: bearer
      header: Authorization
      token: "${input:github_mcp_pat}"
    source:
      repository: "https://github.com/github/github-mcp-server"
      license: "Proprietary"
      available: false
      vendor: "GitHub"

inputs:
  - type: promptString
    id: github_mcp_pat
    description: GitHub Personal Access Token
    password: true
